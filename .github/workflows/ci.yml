name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      native_rust:
        description: "Also check optional native Rust extension"
        type: boolean
        default: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.5.1 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - uses: astral-sh/setup-uv@v6
      - name: Generator tests
        run: make generator-tests
      - name: Headless import, smoke, fixtures, input, Web export
        run: make smoke fixtures input-tests export-web
      - name: Check exported Web artifact
        run: test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck

  native-rust:
    if: github.event_name == 'workflow_dispatch' && inputs.native_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - run: cd rust && cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test -p core
      - run: make native-smoke
