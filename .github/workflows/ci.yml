name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.5.1 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - uses: astral-sh/setup-uv@v6
      - name: Generator tests
        run: make generator-tests
      - name: Clean source native GDScript smoke and fixtures
        run: make smoke fixtures
      - name: Fresh independent Web project
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Web" "$RUNNER_TEMP/web-starter"
          make -C "$RUNNER_TEMP/web-starter" ci
          test -s "$RUNNER_TEMP/web-starter/build/web/index.html"
          test -s "$RUNNER_TEMP/web-starter/build/web/index.wasm"
          test -s "$RUNNER_TEMP/web-starter/build/web/index.pck"
      - name: Fresh independent native GDScript project
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Native" --profile native-gdscript "$RUNNER_TEMP/native-starter"
          make -C "$RUNNER_TEMP/native-starter" ci

  native-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - uses: astral-sh/setup-uv@v6
      - name: 'Fresh Linux Rust starter: fmt, clippy, core, missing-library negative, registration and fixtures'
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Rust" --profile native-rust "$RUNNER_TEMP/rust-starter"
          make -C "$RUNNER_TEMP/rust-starter" ci
      - name: Diagnose failed Linux Rust import
        if: failure()
        shell: bash
        run: |
          set -u
          ulimit -c 0
          source="$RUNNER_TEMP/rust-starter"
          if test ! -f "$source/godot/project.godot"; then
            echo 'Diagnostic project unavailable (failure occurred before generation)'
            exit 0
          fi
          godot="${GODOT:-godot}"
          "$godot" --version
          rustc --version
          grep -A2 -E '^name = "(godot|gdextension-api)"$' "$source/rust/Cargo.lock" || true
          library="$source/godot/addons/my_ext/bin/linux/debug/libmy_ext.so"
          if test -f "$library"; then
            file "$library"
            ldd "$library" || true
          else
            echo 'Built extension not present; no loaded-extension probe'
            exit 0
          fi
          for variant in control direct import debugger; do
            cp -a "$source/godot" "$RUNNER_TEMP/diagnostic-$variant"
            rm -rf "$RUNNER_TEMP/diagnostic-$variant/.godot"
          done
          rm -rf "$RUNNER_TEMP/diagnostic-control/addons/my_ext"
          probe() {
            label="$1"
            shift
            echo "=== $label ==="
            if timeout 45s "$@" >"$RUNNER_TEMP/diagnostic-$label.log" 2>&1; then
              echo "$label exit=0"
            else
              echo "$label exit=$?"
            fi
            tail -n 65 "$RUNNER_TEMP/diagnostic-$label.log"
          }
          probe control "$godot" --headless --import --path "$RUNNER_TEMP/diagnostic-control" --quit
          probe direct "$godot" --headless --path "$RUNNER_TEMP/diagnostic-direct" --script res://scripts/native_smoke_test.gd
          probe import "$godot" --headless --import --path "$RUNNER_TEMP/diagnostic-import" --quit
          if ! command -v gdb >/dev/null 2>&1; then
            echo 'Installing gdb on this disposable CI runner only'
            if sudo timeout 90s apt-get update -qq && sudo env DEBIAN_FRONTEND=noninteractive timeout 90s apt-get install -y -qq gdb; then
              echo 'gdb available for isolated import'
            else
              echo 'gdb installation unavailable; no debugger probe'
            fi
          fi
          if command -v gdb >/dev/null 2>&1; then
            probe debugger gdb -q -batch -ex 'handle SIGSEGV stop print nopass' -ex run -ex 'info sharedlibrary' -ex 'thread apply all bt 18' --args "$godot" --disable-crash-handler --headless --import --path "$RUNNER_TEMP/diagnostic-debugger" --quit
          fi
