name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.5.1 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - uses: astral-sh/setup-uv@v6
      - name: Generator tests
        run: make generator-tests
      - name: Clean source native GDScript smoke and fixtures
        run: make smoke fixtures
      - name: Fresh independent Web project
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Web" "$RUNNER_TEMP/web-starter"
          make -C "$RUNNER_TEMP/web-starter" ci
          test -s "$RUNNER_TEMP/web-starter/build/web/index.html"
          test -s "$RUNNER_TEMP/web-starter/build/web/index.wasm"
          test -s "$RUNNER_TEMP/web-starter/build/web/index.pck"
      - name: Fresh independent native GDScript project
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Native" --profile native-gdscript "$RUNNER_TEMP/native-starter"
          make -C "$RUNNER_TEMP/native-starter" ci

  native-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - uses: astral-sh/setup-uv@v6
      - name: 'Fresh Linux Rust starter: fmt, clippy, core, missing-library negative, registration and fixtures'
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Rust" --profile native-rust "$RUNNER_TEMP/rust-starter"
          make -C "$RUNNER_TEMP/rust-starter" ci
      - name: Diagnose cold-cache Rust import timing
        if: failure()
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          source="$RUNNER_TEMP/rust-starter"
          library="$source/godot/addons/my_ext/bin/linux/debug/libmy_ext.so"
          test -s "$library"
          godot="${GODOT:-godot}"
          metadata="$RUNNER_TEMP/timing-metadata.txt"
          {
            "$godot" --version
            rustc --version
            sha256sum "$source/rust/gdext_bridge/src/lib.rs" "$source/rust/Cargo.lock" "$source/godot/addons/my_ext/my_ext.gdextension" "$library"
          } | tee "$metadata"
          for variant in control timed-1 timed-2 timed-3; do
            mkdir "$RUNNER_TEMP/timing-$variant"
            cp -a "$source/godot" "$RUNNER_TEMP/timing-$variant/godot"
            project="$RUNNER_TEMP/timing-$variant/godot"
            rm -rf "$project/.godot"
            test ! -e "$project/.godot"
            echo "=== $variant fresh-cache import: $project ===" | tee -a "$metadata"
            if test "$variant" = control; then
              printf 'command: %q --headless --import --path %q --quit\n' "$godot" "$project" | tee -a "$metadata"
              if timeout 60s "$godot" --headless --import --path "$project" --quit >"$RUNNER_TEMP/timing-$variant-import.log" 2>&1; then
                echo 'control import exit=0; baseline did not reproduce; stop' | tee -a "$metadata"
                exit 1
              else
                status=$?
                echo "control import exit=$status" | tee -a "$metadata"
                tail -n 22 "$RUNNER_TEMP/timing-$variant-import.log"
                test "$status" -eq 134
                grep -Fq 'Program crashed with signal 11' "$RUNNER_TEMP/timing-$variant-import.log"
              fi
            else
              printf 'command: %q --headless --import --path %q --quit --frame-delay 800\n' "$godot" "$project" | tee -a "$metadata"
              if timeout 60s "$godot" --headless --import --path "$project" --quit --frame-delay 800 >"$RUNNER_TEMP/timing-$variant-import.log" 2>&1; then
                echo "$variant import exit=0" | tee -a "$metadata"
              else
                status=$?
                echo "$variant import exit=$status; stop" | tee -a "$metadata"
                tail -n 30 "$RUNNER_TEMP/timing-$variant-import.log"
                exit 1
              fi
              printf 'command: %q --headless --path %q --script res://scripts/native_smoke_test.gd\n' "$godot" "$project" | tee -a "$metadata"
              if timeout 35s "$godot" --headless --path "$project" --script res://scripts/native_smoke_test.gd >"$RUNNER_TEMP/timing-$variant-smoke.log" 2>&1; then
                status=0
              else
                status=$?
              fi
              echo "$variant RustSmoke exit=$status" | tee -a "$metadata"
              if test "$status" -ne 0 || ! grep -Fq '[NATIVE SMOKE OK]' "$RUNNER_TEMP/timing-$variant-smoke.log"; then
                echo "$variant RustSmoke failure or marker missing; stop" | tee -a "$metadata"
                tail -n 30 "$RUNNER_TEMP/timing-$variant-smoke.log"
                exit 1
              fi
              printf 'command: %q --headless --path %q --script res://scripts/run_fixtures.gd\n' "$godot" "$project" | tee -a "$metadata"
              if timeout 35s "$godot" --headless --path "$project" --script res://scripts/run_fixtures.gd >"$RUNNER_TEMP/timing-$variant-fixtures.log" 2>&1; then
                status=0
              else
                status=$?
              fi
              echo "$variant fixtures exit=$status" | tee -a "$metadata"
              if test "$status" -ne 0 || ! grep -Fq '[FIXTURES OK] 3 passed' "$RUNNER_TEMP/timing-$variant-fixtures.log"; then
                echo "$variant fixtures failure or marker missing; stop" | tee -a "$metadata"
                tail -n 30 "$RUNNER_TEMP/timing-$variant-fixtures.log"
                exit 1
              fi
            fi
          done
          echo 'All three timed imports, mandatory RustSmoke and fixture probes passed; original required job remains red' | tee -a "$metadata"
      - name: Preserve bounded timing transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-rust-timing-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/timing-metadata.txt
            ${{ runner.temp }}/timing-control-import.log
            ${{ runner.temp }}/timing-timed-1-import.log
            ${{ runner.temp }}/timing-timed-1-smoke.log
            ${{ runner.temp }}/timing-timed-1-fixtures.log
            ${{ runner.temp }}/timing-timed-2-import.log
            ${{ runner.temp }}/timing-timed-2-smoke.log
            ${{ runner.temp }}/timing-timed-2-fixtures.log
            ${{ runner.temp }}/timing-timed-3-import.log
            ${{ runner.temp }}/timing-timed-3-smoke.log
            ${{ runner.temp }}/timing-timed-3-fixtures.log
          if-no-files-found: warn
          retention-days: 3
