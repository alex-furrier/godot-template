name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.5.1 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - uses: astral-sh/setup-uv@v6
      - name: Generator tests
        run: make generator-tests
      - name: Clean source native GDScript smoke and fixtures
        run: make smoke fixtures
      - name: Fresh independent Web project
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Web" "$RUNNER_TEMP/web-starter"
          make -C "$RUNNER_TEMP/web-starter" ci
          test -s "$RUNNER_TEMP/web-starter/build/web/index.html"
          test -s "$RUNNER_TEMP/web-starter/build/web/index.wasm"
          test -s "$RUNNER_TEMP/web-starter/build/web/index.pck"
      - name: Fresh independent native GDScript project
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Native" --profile native-gdscript "$RUNNER_TEMP/native-starter"
          make -C "$RUNNER_TEMP/native-starter" ci

  native-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - uses: astral-sh/setup-uv@v6
      - name: 'Fresh Linux Rust starter: fmt, clippy, core, missing-library negative, registration and fixtures'
        run: |
          uv run --no-sync python scripts/generate_starter.py --name "CI Rust" --profile native-rust "$RUNNER_TEMP/rust-starter"
          make -C "$RUNNER_TEMP/rust-starter" ci
      - name: Repeat fresh-cache RustSmoke registration and fixtures
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/rust-starter"
          godot="${GODOT:-godot}"
          test -s "$source/godot/addons/my_ext/bin/linux/debug/libmy_ext.so"
          "$godot" --version
          sha256sum "$source/rust/gdext_bridge/src/lib.rs" "$source/rust/Cargo.lock" "$source/godot/addons/my_ext/my_ext.gdextension" "$source/godot/addons/my_ext/bin/linux/debug/libmy_ext.so"
          for attempt in 1 2 3; do
            project="$(mktemp -d "$RUNNER_TEMP/rust-cold-$attempt.XXXXXX")/godot"
            cp -a "$source/godot" "$project"
            rm -rf "$project/.godot"
            test ! -e "$project/.godot"
            echo "Fresh Rust import $attempt: $godot --headless --import --path $project --quit --frame-delay 800"
            timeout 60s "$godot" --headless --import --path "$project" --quit --frame-delay 800
            echo "Fresh RustSmoke probe $attempt"
            timeout 35s "$godot" --headless --path "$project" --script res://scripts/native_smoke_test.gd | tee "$RUNNER_TEMP/rust-smoke-$attempt.log"
            grep -Fq '[NATIVE SMOKE OK]' "$RUNNER_TEMP/rust-smoke-$attempt.log"
            echo "Fresh fixture probe $attempt"
            timeout 35s "$godot" --headless --path "$project" --script res://scripts/run_fixtures.gd | tee "$RUNNER_TEMP/rust-fixtures-$attempt.log"
            grep -Fq '[FIXTURES OK] 3 passed' "$RUNNER_TEMP/rust-fixtures-$attempt.log"
          done
